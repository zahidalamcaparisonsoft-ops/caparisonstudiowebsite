document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-8px rgba(27,237,172,.6)\">\n<x-import component-from-global-scope=\"CaparisonStudioDesignSystem_14ca17.Icon\" name=\"{{ m.icon }}\" size=\"{{ px22 }}\" color=\"currentColor\" hint-size=\"22px,22px\"><\u002Fx-import>\n<\u002Fspan>\n<div style=\"padding:22px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(27,237,172,.18),0 0 24px -6px rgba(27,237,172,.16);transition:transform .32s cubic-bezier(.16,1,.3,1),box-shadow .32s cubic-bezier(.16,1,.3,1),background .32s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:translateY(-4px);background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(27,237,172,.55),0 0 64px -14px rgba(27,237,172,.42)\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.2em;color:#1BEDAC\">{{ m.step }}<\u002Fspan>\n<h3 style=\"margin:12px 0 8px;font-family:var(--font-display,system-ui);font-size:18px;font-weight:600;color:#fff\">{{ m.title }}<\u002Fh3>\n<p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#8A9793\">{{ m.copy }}<\u002Fp>\n<span style=\"display:inline-block;margin-top:14px;font-family:var(--font-mono,monospace);font-size:11px;color:#5A6763\">{{ m.when }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"story\" style=\"position:relative;padding:104px clamp(20px,5vw,64px);border-top:1px solid rgba(255,255,255,.08);overflow:hidden\">\n<span aria-hidden=\"true\" data-p=\"0.08\" style=\"position:absolute;top:10%;right:-12%;width:44vw;height:44vw;max-width:640px;max-height:640px;border-radius:50%;background:radial-gradient(circle,rgba(27,237,172,.14) 0%,rgba(27,237,172,0) 66%);pointer-events:none\"><\u002Fspan>\n<div style=\"position:relative;max-width:1240px;margin:0 auto\">\n<div data-reveal=\"1\" style=\"display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:start\">\n<div>\n<span style=\"display:inline-flex;a 002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font-family:var(--font-display,system-ui);font-size:32px;font-weight:800;line-height:1;letter-spacing:-.02em;color:#fff;text-shadow:0 0 18px rgba(27,237,172,.45)\">98%<\u002Fspan><span style=\"font-size:13px;color:#8A9793\">On-time delivery<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px\">\n<div style=\"position:relative;padding:32px;border-radius:32px;background:rgba(27,237,172,.08);border:1px solid rgba(27,237,172,.38);backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(27,237,172,.28),0 0 40px -12px rgba(27,237,172,.28);overflow:hidden\">\n<span aria-hidden=\"true\" style=\"position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(27,237,172,0),rgba(27,237,172,.7),rgba(27,237,172,0))\"><\u002Fspan>\n<span style=\"font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#4DF5C6\">Founder<\u002Fspan>\n<p style=\"margin:16px 0 0;font-family:var(--font-display,system-ui);font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.01em;color:#fff\">\"An edit is a promise about someone's time. We keep it frame by frame.\"<\u002Fp>\n<div style=\"display:flex;align-items:center;gap:12px;margin-top:22px\">\n<span style=\"display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;background:linear-gradient(96deg,#4DF5C6,#12CE94);color:#000;font-family:var(--font-display,system-ui);font-size:14px;font-weight:700\">JC<\u002Fspan>\n<span style=\"display:flex;flex-direction:column\"><span style=\"font-size:14px;color:#fff;font-family:var(--font-display,system-ui);font-weight:600\">Jonas Caparison<\u002Fspan><span style=\"font-size:12px;color:#8A9793\">Founder &amp; lead editor<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:24px;border-radius:24px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(18px);box-shadow:0 0 0 1px rgba(27,237,172,.18),0 0 24px -6px rgba(27,237,172,.16)\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5A6763\">The team<\u002Fspan>\n<div style=\"display:flex;flex-direction:column;gap:14px;margin-top:18px\">\n<sc-for list=\"{{ team }}\" as=\"t\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;align-items:center;gap:12px\">\n<span style=\"display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;background:radial-gradient(120% 120% at 30% 0%,#12332A,#050807);border:1px solid rgba(27,237,172,.3);color:#4DF5C6;font-family:var(--font-mono,monospace);font-size:12px\">{{ t.initials }}<\u002Fspan>\n<span style=\"display:flex;flex-direction:column\"><span style=\"font-size:14px;color:#fff;font-family:var(--font-display,system-ui);font-weight:600\">{{ t.name }}<\u002Fspan><span style=\"font-size:12px;color:#8A9793\">{{ t.role }}<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:24px;border-radius:24px;background:rgba(0,0,0,.4);border:1px solid rgba(27,237,172,.38);box-shadow:0 0 0 1px rgba(27,237,172,.28),0 0 40px -12px rgba(27,237,172,.28)\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#4DF5C6\">Mission<\u002Fspan>\n<p style=\"margin:14px 0 0;font-size:15px;line-height:1.6;color:#D6DEDB\">Make weekly publishing survivable for small teams — without the edit getting worse.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"onboarding\" style=\"position:relative;padding:104px clamp(20px,5vw,64px);border-top:1px solid rgba(255,255,255,.08);overflow:hidden\">\n<span aria-hidden=\"true\" style=\"position:absolute;inset:0;background:radial-gradient(70% 60% at 50% 0%,rgba(27,237,172,.16) 0%,rgba(27,237,172,0) 66%);pointer-events:none\"><\u002Fspan>\n<div style=\"position:relative;max-width:860px;margin:0 auto\">\n<div data-reveal=\"1\" style=\"text-align:center\">\n<span style=\"display:inline-flex;align-items:center;gap:12px;font-family:var(--font-mono,monospace);font-size:12px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;color:#1BEDAC\">Start a project<\u002Fspan>\n<h2 style=\"margin:18px 0 0;font-family:var(--font-display,system-ui);font-size:48px;line-height:1.04;letter-spacing:-.025em;font-weight:700;color:#fff\">Four questions. Two minutes.<\u002Fh2>\n<p style=\"margin:16px 0 0;font-size:18px;line-height:1.55;color:#8A9793\">You'll hear back today with a first-cut date.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"margin-top:44px;padding:34px;border-radius:32px;background:linear-gradient(160deg,rgba(22,30,27,.92),rgba(5,8,7,.96));border:1px solid rgba(27,237,172,.38);backdrop-filter:blur(18px);box-shadow:0 40px 120px -30px rgba(0,0,0,.95),0 0 0 1px rgba(27,237,172,.28),0 0 40px -12px rgba(27,237,172,.28);position:relative;overflow:hidden\">\n<span aria-hidden=\"true\" style=\"position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,rgba(27,237,172,0),rgba(27,237,172,.7),rgba(27,237,172,0))\"><\u002Fspan>\n\n<x-import component-from-global-scope=\"CaparisonStudioDesignSystem_14ca17.StepIndicator\" steps=\"{{ stepLabels }}\" current=\"{{ step }}\" hint-size=\"100%,26px\"><\u002Fx-import>\n\n<div style=\"margin-top:28px;min-height:268px\">\n<sc-if value=\"{{ isStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n<div>\n<h3 style=\"margin:0 0 6px;font-family:var(--font-display,system-ui);font-size:26px;letter-spacing:-.015em;font-weight:700;color:#fff\">What are we cutting?<\u002Fh3>\n<p style=\"margin:0 0 22px;font-size:15px;color:#8A9793\">Pick the format. You can change this per project later.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<sc-for list=\"{{ projectTypes }}\" as=\"t\" hint-placeholder-count= -weight:700;color:#fff\">Send us the footage.<\u002Fh3>\n<p style=\"margin:0 0 22px;font-size:15px;color:#8A9793\">Drop files here, or paste a Drive / Dropbox / Frame.io link.<\u002Fp>\n<div sc-camel-on-click=\"{{ addFile }}\" style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:34px;border-radius:24px;border:1px dashed rgba(27,237,172,.45);background:rgba(27,237,172,.06);cursor:pointer;transition:all .22s cubic-bezier(.16,1,.3,1)\" style-hover=\"background:rgba(27,237,172,.1);border-color:rgba(27,237,172,.75);box-shadow:0 0 40px -12px rgba(27,237,172,.4)\">\n<span style=\"display:flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:16px;background:rgba(27,237,172,.1);border:1px solid rgba(27,237,172,.38);color:#1BEDAC\">\n<x-import component-from-global-scope=\"CaparisonStudioDesignSystem_14ca17.Icon\" name=\"upload\" size=\"{{ px22 }}\" color=\"currentColor\" hint-size=\"22px,22px\"><\u002Fx-import>\n<\u002Fspan>\n<span style=\"font-family:var(--font-display,system-ui);font-size:15px;font-weight:600;color:#fff\">Add footage<\u002Fspan>\n<span style=\"font-family:var(--font-mono,monospace);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5A6763\">Up to 2 TB per project<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:10px;margin-top:16px\">\n<sc-for list=\"{{ files }}\" as=\"f\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)\">\n<span style=\"color:#1BEDAC;display:flex\">\n<x-import component-from-global-scope=\"CaparisonStudioDesignSystem_14ca17.Icon\" name=\"film\" size=\"{{ px16 }}\" color=\"currentColor\" hint-size=\"16px,16px\"><\u002Fx-import>\n<\u002Fspan>\n<span style=\"flex:1;font-size:13.5px;color:#fff\">{{ f.name }}<\u002Fspan>\n<span style=\"font-family:var(--font-mono,monospace);fo "display:flex;flex-direction:column;gap:16px\">\n<img src=\"07d04af9-5d96-43d9-b21f-538fd69009b6\" alt=\"Caparison Studio\" style=\"height:78px;width:auto\">\n<p style=\"margin:0;font-size:13px;color:#8A9793;max-width:260px\">A video editing studio for teams that publish every week.<\u002Fp>\n<div style=\"display:flex;gap:10px\">\n<a style=\"display:flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:#8A9793;font-size:12px\">YouTube<\u002Fa>\n<a style=\"display:flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:#8A9793;font-size:12px\">Instagram<\u002Fa>\n<a style=\"display:flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);color:#8A9793;font-size:12px\">LinkedIn<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8A9793\">Services<\u002Fspan>\n<a style=\"font-size:13px;color:#D6DEDB\">YouTube automation<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Vlogs<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Podcasts<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">SaaS animation<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Documentary<\u002Fa>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8A9793\">Studio<\u002Fspan>\n<a href=\"#work\" style=\"font-size:13px;color:#D6DEDB\">Work<\u002Fa><a href=\"#journey\" style=\"font-size:13px;color:#D6DEDB\">Process<\u002Fa><a href=\"#story\" style=\"font-size:13px;color:#D6DEDB\">Our story<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Careers<\u002Fa>\n<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:12px\">\n<span style=\"font-family:var(--font-mono,monospace);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#8A9793\">Contact<\u002Fspan>\n<a style=\"font-size:13px;color:#D6DEDB\">hello@caparison.studio<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Book a call<\u002Fa><a style=\"font-size:13px;color:#D6DEDB\">Client portal<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;max-width:1240px;margin:56px auto 0;padding-top:20px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--font-mono,monospace);font-size:11px;color:#5A6763\">\n<span>© 2026 Caparison Studio<\u002Fspan><span>Cut in Berlin · Delivered worldwide<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:900},&quot;parallaxStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;hexTexture&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;glowIntensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:1.6,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Motion&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    filter: \"all\",\n    step: 0,\n    type: \"yt\",\n    budget: \"b2\",\n    cadence: \"Weekly\",\n    date: \"14 Aug 2026\",\n    notes: \"\",\n    files: [],\n    done: false\n  };\n\n  componentDidMount() {\n    this._onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => {\n        this._raf = null;\n        const y = window.scrollY || 0;\n        const k = (this.props.parallaxStrength ?? 1);\n        document.querySelectorAll(\"[data-p]\").forEach((el) => {\n          const s = parseFloat(el.getAttribute(\"data-p\")) * k;\n          el.style.transform = \"translate3d(0,\" + (-y * s).toFixed(1) + \"px,0)\";\n        });\n      });\n    };\n    window.addEventListener(\"scroll\", this._onScroll, { passive: true });\n\n    this._onMove = (e) => {\n      const host = document.querySelector(\"[data-tilt]\");\n      if (!host) return;\n      const r = host.getBoundingClientRect();\n      const cx = (e.clientX - (r.left + r.width / 2)) / r.width;\n      const cy = (e.clientY - (r.top + r.height / 2)) / r.height;\n      host.style.transform = \"perspective(1500px) rotateY(\" + (cx * 9).toFixed(2) + \"deg) rotateX(\" + (-cy * 7).toFixed(2) + \"deg)\";\n    };\n    window.addEventListener(\"mousemove\", this._onMove);\n\n    this._reveal = () => {\n      const h = window.innerHeight || 800;\n      document.querySelectorAll(\"[data-reveal]:not(.in)\").forEach((el) => {\n        const r = el.getBoundingClientRect();\n        if (r.top < h * 0.92 && r.bottom > 0) el.classList.add(\"in\");\n      });\n    };\n    window.addEventListener(\"scroll\", this._reveal, { passive: true });\n    this._sync = setInterval(() => {\n      this._reveal();\n      document.querySelectorAll(\"[data-card]:not([data-bound])\").forEach((el) => {\n        el.setAttribute(\"data-bound\", \"1\");\n        el.addEventListener(\"mousemove\", (e) => {\n          const r = el.getBoundingClientRect();\n          const cx = (e.clientX - (r.left + r.width / 2)) / r.width;\n          const cy = (e.clientY - (r.top + r.height / 2)) / r.height;\n          el.style.transform = \"perspective(900px) rotateY(\" + (cx * 6).toFixed(2) + \"deg) rotateX(\" + (-cy * 5).toFixed(2) + \"deg) translateY(-4px)\";\n        });\n        el.addEventListener(\"mouseleave\", () => { el.style.transform = \"perspective(900px) rotateY(0) rotateX(0) translateY(0)\"; });\n      });\n    }, 700);\n    this._onScroll();\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener(\"scroll\", this._onScroll);\n    window.removeEventListener(\"mousemove\", this._onMove);\n    window.removeEventListener(\"scroll\", this._reveal);\n    clearInterval(this._sync);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const cats = [\n      { id: \"all\", label: \"All work\" },\n      { id: \"yt\", label: \"YouTube automation\" },\n      { id: \"saas\", label: \"SaaS animation\" },\n      { id: \"doc\", label: \"Documentary\" },\n      { id: \"pod\", label: \"Podcast editing\" }\n    ];\n    const ALL = [\n      { title: \"Deep Field — Ep. 14\", client: \"Deep Field\", duration: \"48:12\", format: \"4K · Multicam\", cat: \"pod\" },\n      { title: \"Ledger — product tour\", client: \"Ledger\", duration: \"1:52\", format: \"Motion · 2D\", cat: \"saas\" },\n      { title: \"Nine Days North\", client: \"Meridian Films\", duration: \"22:40\", format: \"Documentary\", cat: \"doc\" },\n      { title: \"Vault — daily uploads\", client: \"Vault Media\", duration: \"12:06\", format: \"Faceless · Scripted\", cat: \"yt\" },\n      { title: \"Atlas onboarding film\", client: \"Atlas\", duration: \"2:18\", format: \"SaaS · Motion\", cat: \"saas\" },\n      { title: \"The Quiet Hours — Ep. 62\", client: \"Quiet Hours\", duration: \"1:04:20\", format: \"Podcast\", cat: \"pod\" },\n      { title: \"The Salt Line\", client: \"Meridian Films\", duration: \"38:04\", format: \"Documentary\", cat: \"doc\" },\n      { title: \"Signal — 60 shorts\", client: \"Signal Daily\", duration: \"0:48\", format: \"Automation · 9:16\", cat: \"yt\" },\n      { title: \"Rowan Vale — Patagonia\", client: \"Rowan Vale\", duration: \"14:06\", format: \"Vlog\", cat: \"vlog\" }\n    ];\n    const catLabel = { yt: \"YouTube\", saas: \"SaaS\", doc: \"Documentary\", pod: \"Podcast\", vlog: \"Vlog\" };\n    const list = s.filter === \"all\" ? ALL : ALL.filter((p) => p.cat === s.filter);\n\n    const types = [\n      { id: \"yt\", label: \"YouTube automation\", copy: \"Faceless, scripted, high volume.\", icon: \"list-video\" },\n      { id: \"pod\", label: \"Podcast editing\", copy: \"Multicam switching plus a clips pack.\", icon: \"mic\" },\n      { id: \"saas\", label: \"SaaS animation\", copy: \"Screen capture into motion graphics.\", icon: \"monitor-play\" },\n      { id: \"doc\", label: \"Documentary\", copy: \"Long-form assembly and archive.\", icon: \"film\" }\n    ];\n    const budgets = [\n      { id: \"b1\", label: \"Under $1k / month\", note: \"1–2 videos\" },\n      { id: \"b2\", label: \"$1k – $3k / month\", note: \"4 videos + shorts\" },\n      { id: \"b3\", label: \"$3k – $8k / month\", note: \"Weekly + motion\" },\n      { id: \"b4\", label: \"$8k+ / month\", note: \"Named producer\" }\n    ];\n\n    const steps = [\"Project type\", \"Budget\", \"Timeline\", \"Footage\"];\n    const step = s.done ? 4 : s.step;\n    const progress = s.done ? 100 : Math.round(((s.step) / 4) * 100) + 25 * 0;\n    const pct = s.done ? 100 : (s.step + 1) * 25;\n\n    return {\n      px16: 16, px18: 18, px22: 22, px28: 28,\n      shownLabel: list.length + \" of \" + ALL.length + \" projects\",\n      categories: cats.map((c) => ({\n        label: c.label,\n        active: s.filter === c.id,\n        inactive: s.filter !== c.id,\n        select: () => this.setState({ filter: c.id })\n      })),\n      projects: list.map((p) => ({\n        title: p.title, client: p.client, duration: p.duration, format: p.format,\n        cat: catLabel[p.cat] || p.cat,\n        open: () => { const el = document.getElementById(\"onboarding\"); if (el) window.scrollTo({ top: el.offsetTop - 60, behavior: \"smooth\" }); }\n      })),\n      milestones: [\n        { step: \"01\", icon: \"send\", title: \"Brief\", copy: \"Four questions and your files. We reply the same day with a first-cut date.\", when: \"Day 0\", },\n        { step: \"02\", icon: \"clapperboard\", title: \"Assembly\", copy: \"A named editor builds the full cut against your reference and pacing notes.\", when: \"Days 1–4\" },\n        { step: \"03\", icon: \"message-square\", title: \"Review\", copy: \"Comment on a timecode in the portal. Nothing gets lost in a thread.\", when: \"Day 5\" },\n        { step: \"04\", icon: \"rotate-cw\", title: \"Revisions\", copy: \"Two rounds as standard, each turned around in 34 hours.\", when: \"Days 6–7\" },\n        { step: \"05\", icon: \"check-circle\", title: \"Delivery\", copy: \"4K masters, captions, thumbnails and cutdowns for every platform.\", when: \"Day 8\" }\n      ],\n      team: [\n        { initials: \"KB\", name: \"Kai Berger\", role: \"Lead editor — podcast & long-form\" },\n        { initials: \"MR\", name: \"Mira Rask\", role: \"Motion & SaaS animation\" },\n        { initials: \"AO\", name: \"Ari Okonkwo\", role: \"Shorts and automation pipeline\" },\n        { initials: \"SL\", name: \"Sofia Lindqvist\", role: \"Colour & finishing\" }\n      ],\n      testimonials: [\n        { quote: \"We went from two uploads a month to eight, and our average view duration went up.\", initials: \"NO\", name: \"Nadia Osei\", role: \"Head of Content, Deep Field\" },\n        { quote: \"The product tour finally explains the product. Sales sends it before the demo now.\", initials: \"TV\", name: \"Tomas Vidal\", role: \"Marketing lead, Ledger\" },\n        { quote: \"They cut 40 hours of archive into something that holds a cinema. Twice.\", initials: \"HM\", name: \"Hana Mori\", role: \"Director, Meridian Films\" }\n      ],\n      stepLabels: steps,\n      step: step,\n      isStep0: !s.done && s.step === 0,\n      isStep1: !s.done && s.step === 1,\n      isStep2: !s.done && s.step === 2,\n      isStep3: !s.done && s.step === 3,\n      isDone: s.done,\n      projectTypes: types.map((t) => ({\n        label: t.label, copy: t.copy, icon: t.icon,\n        active: s.type === t.id,\n        inactive: s.type !== t.id,\n        select: () => this.setState({ type: t.id })\n      })),\n      budgets: budgets.map((b) => ({\n        label: b.label, note: b.note,\n        active: s.budget === b.id,\n        inactive: s.budget !== b.id,\n        select: () => this.setState({ budget: b.id })\n      })),\n      cadences: [\"One-off\", \"Weekly\", \"Twice weekly\", \"Daily\"],\n      cadence: s.cadence,\n      setCadence: (e) => this.setState({ cadence: e.target.value }),\n      dateValue: s.date,\n      setDate: (e) => this.setState({ date: e.target.value }),\n      notes: s.notes,\n      setNotes: (e) => this.setState({ notes: e.target.value }),\n      files: s.files,\n      addFile: () => {\n        const n = s.files.length + 1;\n        this.setState({ files: s.files.concat([{ name: \"EP15_CAM\" + n + \"_A001.mov\", size: \"18.4 GB\", state: \"Uploaded\" }]) });\n      },\n      progress: pct,\n      progressLabel: pct + \"%\",\n      nextLabel: s.step === 3 ? \"Send the brief\" : \"Continue →\",\n      canGoBack: !s.done && s.step > 0,\n      backDisabled: s.done || s.step === 0,\n      next: () => { if (s.step === 3) this.setState({ done: true }); else this.setState({ step: Math.min(3, s.step + 1) }); },\n      back: () => { if (!s.done && s.step > 0) this.setState({ step: s.step - 1 }); },\n      restart: () => this.setState({ done: false, step: 0, files: [] }),\n      summary: \"Cutting \" + (types.find((t) => t.id === s.type) || types[0]).label.toLowerCase() + \", \" + s.cadence.toLowerCase() + \", first cut by \" + s.date + \". Kai will confirm today.\"\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
